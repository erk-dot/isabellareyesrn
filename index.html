<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isabella Reyes, RN</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-light: #fdf1f4;
            --pink-mid: #f6cddc;
            --pink-accent: #e88aa8;
            --pink-deep: #c85d82;
            --text-dark: #4a3540;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(180deg, var(--pink-light) 0%, var(--pink-mid) 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(200, 93, 130, 0.15);
            padding: 3rem 3rem 2.5rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        .photo-placeholder {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: var(--pink-mid);
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid var(--pink-accent);
            overflow: hidden;
        }

        .photo-placeholder svg {
            width: 70px;
            height: 70px;
            fill: var(--white);
        }

        .photo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--pink-deep);
            margin-bottom: 0.25rem;
        }

        .credential {
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--pink-accent);
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .tagline {
            font-size: 0.95rem;
            color: var(--text-dark);
            opacity: 0.75;
            line-height: 1.6;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--text-dark);
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="photo-placeholder">
            <img src="photo.jpg" alt="Isabella Reyes, RN">
        </div>
        <div class="credential">Registered Nurse</div>
        <h1>Isabella Reyes, RN</h1>
        <p class="tagline">Site coming soon.</p>
        <footer>&copy; 2026 Isabella Reyes, RN</footer>
    </div>
</body>
</html>
