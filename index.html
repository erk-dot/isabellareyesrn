<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isabella Reyes, RN</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-light: #fdf1f4;
            --pink-mid: #f6cddc;
            --pink-accent: #e88aa8;
            --pink-deep: #c85d82;
            --text-dark: #4a3540;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(180deg, var(--pink-light) 0%, var(--pink-mid) 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        /* Subtle decorative medical icons in the background */
        .bg-icon {
            position: fixed;
            fill: none;
            stroke: var(--pink-deep);
            opacity: 0.1;
            pointer-events: none;
            z-index: 0;
        }

        .bg-icon.solid {
            fill: var(--pink-deep);
            stroke: none;
        }

        .bg-icon--cross-tl { top: 6%; left: 6%; width: 70px; height: 70px; transform: rotate(-8deg); }
        .bg-icon--heart-tr { top: 9%; right: 8%; width: 60px; height: 60px; transform: rotate(6deg); }
        .bg-icon--pulse-br { bottom: 8%; right: 6%; width: 130px; height: 60px; }
        .bg-icon--cross-bl { bottom: 10%; left: 9%; width: 46px; height: 46px; transform: rotate(12deg); }

        .card {
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(200, 93, 130, 0.15);
            padding: 2.5rem 2.5rem 2rem;
            max-width: 380px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .photo-frame {
            width: 220px;
            height: 300px;
            border-radius: 16px;
            background: var(--pink-mid);
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid var(--pink-accent);
            overflow: hidden;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--pink-deep);
            margin-bottom: 0.25rem;
        }

        .credential {
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--pink-accent);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        footer {
            margin-top: 1.75rem;
            font-size: 0.75rem;
            color: var(--text-dark);
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <!-- Subtle background accents -->
    <svg class="bg-icon bg-icon--cross-tl" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round">
        <path d="M12 4v16M4 12h16"/>
    </svg>
    <svg class="bg-icon solid bg-icon--heart-tr" viewBox="0 0 24 24">
        <path d="M12 21s-7.5-4.6-10-9.3C.4 8.1 2.3 4.5 6 4.5c2.1 0 3.6 1.2 4.5 2.7 1.4.4 2.4 1.4 2.4 2.7 0-1.3 1-2.3 2.4-2.7.9-1.5 2.4-2.7 4.5-2.7 3.7 0 5.6 3.6 4 7.2C19.5 16.4 12 21 12 21z" transform="scale(0.85) translate(2,2)"/>
    </svg>
    <svg class="bg-icon bg-icon--pulse-br" viewBox="0 0 130 60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="0,30 30,30 40,10 50,50 60,15 68,30 130,30"/>
    </svg>
    <svg class="bg-icon bg-icon--cross-bl" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round">
        <path d="M12 4v16M4 12h16"/>
    </svg>

    <div class="card">
        <div class="photo-frame">
            <img src="photo.jpg" alt="Isabella Reyes, RN">
        </div>
        <div class="credential">Registered Nurse</div>
        <h1>Isabella Reyes, RN</h1>
        <footer>&copy; 2026 Isabella Reyes, RN</footer>
    </div>
</body>
</html>
